# AI Translate - the build robot.
#
# Whenever release or main moves, every hour for a new Vencord, and on demand
# from Actions > Build > Run workflow, this fetches build/github.sh from the
# plugin's release branch and runs it, and that script decides whether there
# is anything new to build. It takes the copy on release rather than the one
# on main, so a build only ever follows what has been released. It uses no
# ready-made GitHub actions, only what every GitHub runner already has, so
# nothing in it goes out of date.
#
# The finished files go on builds.zolatau.com rather than into a release here.
# That needs two secrets, under Settings > Secrets and variables > Actions:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

name: Build

# A push runs this file as it is on the branch pushed to, the schedule as it is
# on main, so a change here has to reach release too.
on:
  # GitHub fires the hourly schedule hours apart, so neither channel waits for
  # it: release is the released one, main the testing one.
  push:
    branches: [release, main]
  # Vencord moves without telling anyone.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  # Notes each build on the "robot" branch.
  contents: write
  # Asks GitHub to keep this hourly schedule on.
  actions: write
  # Opens an issue when the build starts failing, and closes it when it stops.
  issues: write

# One run at a time, whatever started it: each deploys the whole site, so two
# at once would undo each other. A new run waits instead of cancelling the one
# that is going. GitHub keeps only the newest waiting run, which is enough,
# since a run reads both branches when it starts.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build AI Translate
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # By commit, not by branch: raw.githubusercontent.com keeps a branch's
        # file for five minutes, and a release that has just moved must not
        # build with the script it had before.
        run: |
          commit=$(git ls-remote https://github.com/mozumidesu/ai-translate.git refs/heads/release | cut -f1)
          [ -n "$commit" ] || { echo "Could not read the release branch."; exit 1; }
          curl -fsSL "https://raw.githubusercontent.com/mozumidesu/ai-translate/$commit/build/github.sh" -o github.sh
          bash github.sh

      # A robot that fails silently is how Forms and Text left the plugin
      # unbuilt for three days in October 2026: the runs were red the whole
      # time and nobody was told. One issue is opened for an outage and closed
      # when it ends, rather than a comment an hour for as long as it lasts.
      #
      # This lives in the workflow rather than in github.sh because a run can
      # fail before that file has even been fetched.
      - name: Say so if the build is failing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The build robot is failing
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ -n "$open" ]; then
              echo "Issue #$open is already open about this."
              exit 0
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body \
              "The build failed and nothing new was published. Installed
          copies keep running the build that is already out, so nothing is
          broken for anyone, but no change reaches users until this is fixed.

          The run that failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This issue closes itself when a build succeeds again."

      - name: Close that if it is building again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The build robot is failing
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --reason completed \
                  --comment "Building again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
